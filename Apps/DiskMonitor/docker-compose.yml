name: disk-monitor

services:
  disk-monitor:
    container_name: disk-monitor
    hostname: disk-monitor
    image: ghcr.io/isanto1306/disk-monitor:latest
    restart: unless-stopped
    init: true

    deploy:
      resources:
        reservations:
          memory: 256M

    labels:
      icon: https://raw.githubusercontent.com/isanto1306/Disk-Monitor/main/static/web-app-icon-512.png

    network_mode: host
    privileged: true

    environment:
      DISK_MONITOR_USERNAME: "CHANGE_ME_USERNAME"
      DISK_MONITOR_PASSWORD: "CHANGE_ME_PASSWORD_AT_LEAST_12_CHARS"
      DISK_MONITOR_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET_AT_LEAST_32_CHARS"
      DISK_MONITOR_SESSION_HTTPS_ONLY: "false"

    volumes:
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /DATA/AppData/disk-monitor/cache
        target: /app/cache

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 15s

    x-casaos:
      envs:
        - container: DISK_MONITOR_USERNAME
          description:
            en_US: Disk Monitor login username. Change before installation.
            de_DE: Benutzername für Disk Monitor. Vor der Installation ändern.
        - container: DISK_MONITOR_PASSWORD
          description:
            en_US: Disk Monitor login password (at least 12 characters). Change before installation.
            de_DE: Passwort für Disk Monitor (mindestens 12 Zeichen). Vor der Installation ändern.
        - container: DISK_MONITOR_SESSION_SECRET
          description:
            en_US: Private session secret (at least 32 characters). Generate a unique random value before installation.
            de_DE: Privates Session-Geheimnis (mindestens 32 Zeichen). Vor der Installation einen eindeutigen Zufallswert eintragen.
        - container: DISK_MONITOR_SESSION_HTTPS_ONLY
          description:
            en_US: Set to true only when Disk Monitor is served exclusively over HTTPS.
            de_DE: Nur auf true setzen, wenn Disk Monitor ausschließlich über HTTPS bereitgestellt wird.
      volumes:
        - container: /app/cache
          description:
            en_US: Disk Monitor AppData - persistent SMART history, settings and runtime cache.
            de_DE: Disk-Monitor-AppData - persistenter SMART-Verlauf, Einstellungen und Laufzeit-Cache.

x-casaos:
  id: io.github.isanto1306.disk-monitor
  store_app_id: disk-monitor
  main: disk-monitor
  index: /
  port_map: "8999"
  scheme: http
  icon: https://raw.githubusercontent.com/isanto1306/Disk-Monitor/main/static/web-app-icon-512.png
  title:
    en_US: Disk Monitor
    de_DE: Disk Monitor
  tagline:
    en_US: Storage, SMART and disk activity monitoring for ZimaOS/Linux
    de_DE: Speicher-, SMART- und Festplattenaktivitätsüberwachung für ZimaOS/Linux
  description:
    en_US: |
      Self-hosted disk monitoring dashboard with SMART health, temperature,
      standby state, activity and RAID information.

      **Before installation:** Use **Custom install → Advanced (show more)** and
      replace all security placeholders before starting Disk Monitor for the
      first time. Set your own `DISK_MONITOR_USERNAME`, choose a
      `DISK_MONITOR_PASSWORD` with at least 12 characters, and generate a unique
      `DISK_MONITOR_SESSION_SECRET` with at least 32 characters. Do not install
      the app with the `CHANGE_ME_...` values unchanged.

      Leave `DISK_MONITOR_SESSION_HTTPS_ONLY` set to `false` for normal local
      HTTP access. Set it to `true` only when Disk Monitor is served exclusively
      over HTTPS.
    de_DE: |
      Selbst gehostetes Festplatten-Dashboard mit SMART-Zustand, Temperatur,
      Standby-Status, Aktivität und RAID-Informationen.

      **Vor der Installation:** Über **Benutzerdefinierte Installation → Erweitert**
      alle Sicherheits-Platzhalter vor dem ersten Start ändern. Einen eigenen
      `DISK_MONITOR_USERNAME` festlegen, ein `DISK_MONITOR_PASSWORD` mit mindestens
      12 Zeichen wählen und einen eindeutigen `DISK_MONITOR_SESSION_SECRET` mit
      mindestens 32 Zeichen erzeugen. Die App nicht mit unveränderten
      `CHANGE_ME_...`-Werten installieren.

      `DISK_MONITOR_SESSION_HTTPS_ONLY` für normalen lokalen HTTP-Zugriff auf
      `false` lassen. Nur auf `true` setzen, wenn Disk Monitor ausschließlich
      über HTTPS erreichbar ist.
  tips:
    before_install:
      en_US: >-
        Use Custom install → Advanced (show more) before the first start. Change
        DISK_MONITOR_USERNAME, set a password with at least 12 characters, and
        generate a unique session secret with at least 32 characters. Do not
        leave any CHANGE_ME_... placeholder unchanged.
      de_DE: >-
        Vor dem ersten Start die benutzerdefinierte Installation → Erweitert
        verwenden. Benutzername ändern, ein Passwort mit mindestens 12 Zeichen
        setzen und ein eindeutiges Session-Geheimnis mit mindestens 32 Zeichen
        erzeugen. Keine CHANGE_ME_...-Platzhalter unverändert lassen.
  author: isanto1306
  developer: isanto1306
  category: Others
  architectures:
    - amd64
  version: "0.32.77"
  update_at: "2026-09-03"
  repo: https://github.com/isanto1306/Disk-Monitor
  support: https://github.com/isanto1306/Disk-Monitor/issues
  docs: https://github.com/isanto1306/Disk-Monitor#readme
