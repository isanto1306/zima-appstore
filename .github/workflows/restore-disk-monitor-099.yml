name: Restore Disk Monitor AppStore 0.32.99

on:
  push:
    branches:
      - cleanup-disk-monitor-099

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Restore Disk Monitor metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Apps/DiskMonitor/docker-compose.yml")
          s = p.read_text()
          s2 = s.replace('version: "0.32.103"', 'version: "0.32.99"')
          s2 = s2.replace('update_at: "2026-10-23"', 'update_at: "2026-09-21"')
          if s2 == s:
              raise SystemExit("Expected Disk Monitor 0.32.103 metadata was not found")
          p.write_text(s2)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Apps/DiskMonitor/docker-compose.yml
          git commit -m "Restore Disk Monitor AppStore to 0.32.99"
          git push origin HEAD:main
