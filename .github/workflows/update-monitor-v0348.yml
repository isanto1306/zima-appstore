name: Update Monitor v0.3.348 store sync

on:
  push:
    branches:
      - update-monitor-v0.3.348
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update-monitor-v0.3.348
          fetch-depth: 0
      - name: Update and validate Store version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Apps/UpdateMonitor/docker-compose.yml')
          s=p.read_text(encoding='utf-8')
          old='version: "0.3.347"'
          new='version: "0.3.348"'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one old marker, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          grep -n 'version: "0.3.348"' Apps/UpdateMonitor/docker-compose.yml
          git diff --check
      - name: Commit Store version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Apps/UpdateMonitor/docker-compose.yml
          git commit -m "Update Update Monitor store version to v0.3.348"
          git push origin update-monitor-v0.3.348
