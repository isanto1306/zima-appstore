name: Release Store

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: release-store
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx for GHCR manifest verification
        uses: docker/setup-buildx-action@v3

      - name: Test store version synchronization
        run: python3 -m unittest discover -s tests -v

      - name: Sync Install Monitor to latest published GHCR beta
        run: python3 scripts/sync_install_monitor.py

      - name: Build v2 dist
        uses: IceWhaleTech/build-appstore-action@v1
        with:
          source: .
          output: dist
          base-url: https://isanto1306.github.io/zima-appstore
          cache-file: .cache/build_appstore/image-size-cache.json
          digest-cache-file: .cache/build_appstore/image-digest-cache.json

      - name: Preserve original Install Monitor icon everywhere
        run: python3 scripts/pin_install_monitor_icon.py dist

      - name: Show what was built
        run: |
          echo "--- dist tree ---"
          find dist -type f | sort
          echo "--- store.json ---"
          cat dist/store.json
          echo "--- index.json ---"
          cat dist/index.json

      - name: Deploy dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist

      - name: Commit published Install Monitor version back to store source
        run: |
          if git diff --quiet -- Apps/InstallMonitor/docker-compose.yml; then
            echo "Store source is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Apps/InstallMonitor/docker-compose.yml
          git commit -m "store: synchronize Install Monitor with published GHCR beta"
          git push origin HEAD:main
