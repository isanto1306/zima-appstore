# Install Monitor v0.2.62-beta.19 public beta for iSanto1306 ZimaOS App Store.
# For the first installation, replace every CHANGE_ME_... value under
# Custom install -> Advanced before starting. The server refuses placeholders.
# Docker socket access provides broad control over the Docker host.
name: install-monitor

services:
  install-monitor:
    container_name: install-monitor
    hostname: install-monitor
    image: ghcr.io/isanto1306/install-monitor:0.2.62-beta.19@sha256:50cb4c4b1e8b2894a1eca9ce2d76f271ff51dbb60b274977968e8c7af48e5f53
    restart: unless-stopped
    init: true
    network_mode: host
    depends_on:
      - registry

    deploy:
      resources:
        reservations:
          memory: 512M

    environment:
      IM_ADMIN_USERNAME: "CHANGE_ME_USERNAME"
      IM_ADMIN_PASSWORD: "CHANGE_ME_PASSWORD_AT_LEAST_12_CHARS"
      IM_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET_AT_LEAST_32_CHARS"
      IM_ENFORCE_CREDENTIAL_POLICY: "true"
      IM_COOKIE_SECURE: "false"

    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /DATA/AppData/Install-Monitor/data
        target: /app/data
      - type: bind
        source: /DATA
        target: /im-browse/DATA
        read_only: true
      - type: bind
        source: /media
        target: /im-browse/media
        read_only: true

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s

  registry:
    image: registry:2.8.3@sha256:46faa9a1ae6813194b53921a370f2f4f8c5e1aae228a89bceafef5847a6a3278
    container_name: install-monitor-local-registry
    restart: unless-stopped
    ports:
      - "127.0.0.1:50813:5000"
    volumes:
      - type: bind
        source: /DATA/AppData/Install-Monitor/registry
        target: /var/lib/registry
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

x-casaos:
  id: io.github.isanto1306.install-monitor
  main: install-monitor
  index: /
  port_map: "9012"
  scheme: http
  icon: https://raw.githubusercontent.com/isanto1306/Install-Monitor/main/static/install-monitor-icon.png
  title:
    en_US: Install Monitor
    de_DE: Install Monitor
    fr_FR: Install Monitor
    pt_PT: Install Monitor
    es_ES: Install Monitor
  version: "0.2.62-beta.19"
