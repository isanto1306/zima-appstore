name: disk-monitor

services:
  disk-monitor:
    container_name: disk-monitor
    hostname: disk-monitor
    image: ghcr.io/isanto1306/disk-monitor:latest@sha256:5d9a688c5d697b70e2e7b48165f9c34fa5f0b79dc09fa13058766b5a82a548c7
    restart: unless-stopped
    init: true

    deploy:
      resources:
        reservations:
          memory: 256M

    network_mode: host
    privileged: true

    environment:
      DISK_MONITOR_USERNAME: "CHANGE_ME_USERNAME"
      DISK_MONITOR_PASSWORD: "CHANGE_ME_PASSWORD_AT_LEAST_12_CHARS"
      DISK_MONITOR_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET_AT_LEAST_32_CHARS"
      DISK_MONITOR_SESSION_HTTPS_ONLY: "false"

    volumes:
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /dev
        target: /dev
      - type: bind
        source: /DATA/AppData/disk-monitor/cache
        target: /app/cache

    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 15s

x-casaos:
  id: io.github.isanto1306.disk-monitor
  main: disk-monitor
  index: /
  port_map: "8999"
  scheme: http
  icon: https://isanto1306.github.io/zima-appstore/apps/io.github.isanto1306.disk-monitor/assets/icon.png
  title:
    en_US: Disk Monitor
    de_DE: Disk Monitor
  version: "0.32.81"
