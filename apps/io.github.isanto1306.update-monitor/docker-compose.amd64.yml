name: update-monitor

services:
  update-monitor:
    container_name: update-monitor
    hostname: update-monitor
    image: ghcr.io/isanto1306/update-monitor:latest@sha256:674f619105a3df88bf7006ddb951528aba9314779d9f3cf3efe30a954c0dbb39
    restart: unless-stopped
    init: true

    deploy:
      resources:
        reservations:
          memory: 512M

    network_mode: host

    environment:
      UPDATE_MONITOR_USERNAME: "CHANGE_ME_USERNAME"
      UPDATE_MONITOR_PASSWORD: "CHANGE_ME_PASSWORD_AT_LEAST_12_CHARS"
      UPDATE_MONITOR_SESSION_SECRET: "CHANGE_ME_SESSION_SECRET_AT_LEAST_32_CHARS"
      UPDATE_MONITOR_SESSION_HTTPS_ONLY: "false"
      UPDATE_MONITOR_SCAN_ON_START: "true"
      UPDATE_MONITOR_GITHUB_TOKEN: ""
      UPDATE_MONITOR_BACKUP_DIR: /app/backups

    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /var/run/casaos
        target: /host/run/casaos
        read_only: true
      - type: bind
        source: /DATA/AppData/update-monitor/cache
        target: /app/cache
      - type: bind
        source: /DATA/AppData/update-monitor/backups
        target: /app/backups

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    stop_grace_period: 30s

x-casaos:
  id: io.github.isanto1306.update-monitor
  main: update-monitor
  index: /
  port_map: "9001"
  scheme: http
  icon: https://isanto1306.github.io/zima-appstore/apps/io.github.isanto1306.update-monitor/assets/icon.png
  title:
    en_US: Update Monitor
    de_DE: Update Monitor
  version: "0.3.328"
